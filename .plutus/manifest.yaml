schema_version: "2.0"

repo:
  name: minimalist_er_grid
  primary_language: python

env:
  base: python
  python_version: "3.12"
  manager: pip
  requirements_file: requirements.txt
  gpu_required: false
  install_project: false

secrets: []

data_sources:
  processed: []
  raw: []

steps:
  - id: data_preparation
    nine_step: step_2_data_preparation
    required: true
    network: none
    command: "python run_data_prep.py"
    outputs:
      - "data/data_summary.json"

  - id: in_sample
    nine_step: step_4_in_sample
    required: true
    network: none
    command: "python run_is.py"
    depends_on:
      - data_preparation
    outputs:
      - "images/equity_curve_in_sample.png"

  - id: optimization
    nine_step: step_5_optimization
    required: true
    network: none
    command: "python run_optimization.py"
    depends_on:
      - in_sample
    outputs:
      - "config/best_params.yaml"
      - "results/optimization_grid_surface.csv"

  - id: out_of_sample
    nine_step: step_6_out_of_sample
    required: true
    network: none
    command: "python run_oos.py"
    depends_on:
      - optimization
    outputs:
      - "images/equity_curve_out_sample.png"

  - id: test_2025
    nine_step: step_6_out_of_sample
    required: true
    network: none
    command: "python run_2025.py"
    depends_on:
      - optimization
    outputs:
      - "images/equity_curve_2025.png"

  - id: holdout_evaluation
    nine_step: step_7_paper_trading
    required: true
    network: none
    command: "python run_holdout.py"
    depends_on:
      - out_of_sample
    outputs:
      - "images/equity_curve_holdout.png"

