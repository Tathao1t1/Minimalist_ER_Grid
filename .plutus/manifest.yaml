schema_version: "2.0"

repo:
  name: minimalist_er_grid
  primary_language: python

env:
  base: python
  python_version: "3.12"
  manager: pip
  requirements_file: requirements.txt
  gpu_required: false
  install_project: false

secrets: []

data_sources:
  processed: []
  raw: []

steps:
  - id: data_preparation
    nine_step: step_2_data_preparation
    required: true
    network: none
    command: "python run_data_prep.py"
    outputs:
      - "data/data_summary.json"

  - id: in_sample
    nine_step: step_4_in_sample
    required: true
    network: none
    command: "python run_is.py"
    depends_on:
      - data_preparation
    outputs:
      - "images/equity_curve_in_sample.png"

  - id: optimization
    nine_step: step_5_optimization
    required: true
    network: none
    command: "python run_optimization.py"
    depends_on:
      - in_sample
    outputs:
      - "config/best_params.yaml"
      - "results/optimization_grid_surface.csv"

  - id: out_of_sample
    nine_step: step_6_out_of_sample
    required: true
    network: none
    command: "python run_oos.py"
    depends_on:
      - optimization
    outputs:
      - "images/equity_curve_out_sample.png"

  - id: holdout_evaluation
    nine_step: step_7_paper_trading
    required: true
    network: none
    command: "python run_holdout.py"
    depends_on:
      - out_of_sample
    outputs:
      - "images/equity_curve_holdout.png"

expected:
  - step_id: data_preparation
    metrics:
      - name: in_sample_bars
        value: 192886
        tolerance: {kind: exact, value: 0}
      - name: out_of_sample_bars
        value: 67428
        tolerance: {kind: exact, value: 0}
      - name: test_2025_bars
        value: 66244
        tolerance: {kind: exact, value: 0}
      - name: holdout_bars
        value: 46203
        tolerance: {kind: exact, value: 0}
    artifacts: []

  - step_id: in_sample
    metrics:
      - name: hpr
        value: 0.0279
        tolerance: {kind: relative, value: 0.05}
      - name: annual_return
        value: 0.0102
        tolerance: {kind: relative, value: 0.05}
      - name: max_drawdown
        value: 0.0385
        tolerance: {kind: relative, value: 0.05}
      - name: daily_sharpe
        value: -1.510
        tolerance: {kind: absolute, value: 0.15}
      - name: calmar_ratio
        value: 0.265
        tolerance: {kind: absolute, value: 0.05}
      - name: win_rate
        value: 0.670
        tolerance: {kind: relative, value: 0.05}
      - name: total_trades
        value: 767
        tolerance: {kind: relative, value: 0.05}
      - name: tp_trades
        value: 514
        tolerance: {kind: relative, value: 0.05}
    artifacts:
      - path: images/equity_curve_in_sample.png
        compare: visual_similarity
        threshold: 0.70

  - step_id: optimization
    metrics:
      - name: best_n_levels
        value: 16
        tolerance: {kind: exact, value: 0}
      - name: best_grid_spacing_pct
        value: 0.022
        tolerance: {kind: relative, value: 0.05}
    artifacts: []

  - step_id: out_of_sample
    metrics:
      - name: hpr
        value: 0.0559
        tolerance: {kind: relative, value: 0.05}
      - name: annual_return
        value: 0.0560
        tolerance: {kind: relative, value: 0.05}
      - name: max_drawdown
        value: 0.0091
        tolerance: {kind: relative, value: 0.05}
      - name: daily_sharpe
        value: -0.247
        tolerance: {kind: absolute, value: 0.15}
      - name: calmar_ratio
        value: 6.153
        tolerance: {kind: relative, value: 0.05}
      - name: win_rate
        value: 0.745
        tolerance: {kind: relative, value: 0.05}
      - name: total_trades
        value: 200
        tolerance: {kind: relative, value: 0.05}
      - name: tp_trades
        value: 149
        tolerance: {kind: relative, value: 0.05}
    artifacts:
      - path: images/equity_curve_out_sample.png
        compare: visual_similarity
        threshold: 0.70

  - step_id: holdout_evaluation
    metrics:
      - name: hpr
        value: 0.0537
        tolerance: {kind: relative, value: 0.05}
      - name: annual_return
        value: 0.0774
        tolerance: {kind: relative, value: 0.05}
      - name: max_drawdown
        value: 0.0213
        tolerance: {kind: relative, value: 0.05}
      - name: daily_sharpe
        value: 0.431
        tolerance: {kind: absolute, value: 0.15}
      - name: calmar_ratio
        value: 3.639
        tolerance: {kind: relative, value: 0.05}
      - name: win_rate
        value: 0.774
        tolerance: {kind: relative, value: 0.05}
      - name: total_trades
        value: 248
        tolerance: {kind: relative, value: 0.05}
      - name: tp_trades
        value: 192
        tolerance: {kind: relative, value: 0.05}
    artifacts:
      - path: images/equity_curve_holdout.png
        compare: visual_similarity
        threshold: 0.70

nine_step_coverage:
  step_1_hypothesis: {present: true, section: "1. Forming Algorithm Hypothesis"}
  step_2_data_preparation: {present: true, section: "2. Data Preparation"}
  step_3_forming_set_of_rules: {present: true, section: "3. Transforming a Hypothesis to a Set of Rules"}
  step_4_in_sample: {present: true, section: "4. Backtesting on In-Sample Data"}
  step_5_optimization: {present: true, section: "5. Optimization"}
  step_6_out_of_sample: {present: true, section: "6. Backtesting on Out-of-Sample Historical Data"}
  step_7_paper_trading: {present: true, section: "7. Paper Trading & Forward Holdout Evaluation"}
